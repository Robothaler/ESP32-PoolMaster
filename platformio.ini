; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Project Configuration File
[platformio]
default_envs = serial_upload

[env]
; 3.3.6 — letzter Stand ohne TLSF BLE-Crash (issues #12357, #12524)
; 3.3.7 crasht mit block_locate_free, 3.3.8 verliert zusätzlich 49KB RAM
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; Auto-upload SPIFFS image (data/) before every firmware upload, but only if
; data/ or partitions.csv have changed since the last successful upload.
; Applies to ALL envs that inherit from [env] (serial_upload, OTA_upload,
; matter_serial, matter_ota).  See scripts/upload_fs_if_changed.py.
extra_scripts = pre:scripts/upload_fs_if_changed.py

build_flags =
  -I include
  -I "/home/robothaler/credentials"
  -DCORE_DEBUG_LEVEL=5
  ;-D DEBUG_I2C_LOCK                         ; Debug I2C-Lock
  -D DISABLE_IMAP
  -D DISABLE_FLASH 
  -D DISABLE_SD
  -D DISABLE_NTP_TIME
  -D SILENT_MODE
  -D BOARD_HAS_PSRAM
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000    ; Timeout für TCP-Verbindung (Standard)
  -D CONFIG_ASYNC_TCP_PRIORITY=10          ; Priorität (Standard)
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64        ; Warteschlangengröße (Standard)
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1       ; Führe AsyncTCP auf Core 1 (Arduino-Core) aus
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192      ; 8K — 4K war zu wenig (stack overflow bei WS _queueMessage)
  -D CONFIG_ESP32_ENABLE_COREDUMP=1        ; Aktiviere Core-Dump

lib_compat_mode = strict
lib_ldf_mode = chain
lib_extra_dirs =
    ${PROJECT_DIR}\..\include
    ${PROJECT_DIR}\..\lib

lib_deps =
	symlink://lib/ADS1115
	symlink://lib/MotorValve-master
	symlink://lib/PCF_Pump-master
    Arduino_DebugUtils @ 1.4.0
    paulstoffregen/Time @ 1.6
    br3ttb/PID @ 1.2.1
    adafruit/RTClib
    256dpi/MQTT @ ^2.4.8
    robtillaart/RunningMedian @ 0.3.9
    bblanchon/ArduinoJson @ 6.17.2
    milesburton/DallasTemperature @ 3.9.1
    marvinroger/AsyncMqttClient @ 0.9.0
    adafruit/Adafruit BME280 Library @ 2.2.2
    seithan/Easy Nextion Library @ 1.0.6
    ; PaulStoffregen/OneWire @ 2.3.8
    https://github.com/promillen/OneWire/archive/refs/heads/patch-1.zip ;Patch für ESP32-S3
    ESP32Async/AsyncTCP
  	ESP32Async/ESPAsyncWebServer
    ; mobizt/ESP Mail Client @ ^3.4.19

[env:serial_upload]
lib_deps = ${env.lib_deps}
build_flags = 
    ${env.build_flags}
    ; Bisect: uncomment to disable most pool tasks: -D POOLMASTER_ENABLE_ALL_POOL_TASKS=0
    ;-D DEVT
    ;-DCONFIG_HEAP_POISONING_COMPREHENSIVE
upload_protocol = esptool
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
;debug_tool = esp-builtin
; build_type = debug
;debug_init_break = tbreak setup  ; Optional: Startet Debugger bei setup()

[env:OTA_upload]
lib_deps = ${env.lib_deps}
build_flags =
    ${env.build_flags}
upload_protocol = espota
upload_port = 192.168.178.156
upload_flags =
    --port=8063
    --auth=Fgixy001

; ─────────────────────────────────────────────────────────────────────────────
; Matter environments  (select via PlatformIO environment picker)
; Requires esp_matter component via idf_component.yml (ESP-IDF 5.x).
; pioarduino stable platform already ships with ESP-IDF 5.x — no platform
; change needed.  The idf_component.yml in the project root triggers the
; component manager to fetch espressif/esp_matter automatically.
;
; Additional build size: ~1.5–2 MB for Matter stack.  The existing 4 MB
; factory partition (partitions.csv) is sufficient.
; NVS (64 KB) is shared between pool config (~16 KB) and Matter (~32 KB).
; ─────────────────────────────────────────────────────────────────────────────

; ─────────────────────────────────────────────────────────────────────────────
; Matter environments use framework = espidf, arduino (like BeltWinder-Matter).
; This triggers the IDF component manager which fetches esp_matter via
; src/idf_component.yml and populates managed_components/.
; The root CMakeLists.txt configures IDF build flags.
; Regular (serial_upload/OTA_upload) environments remain framework = arduino.
; ─────────────────────────────────────────────────────────────────────────────

[env:matter_serial]
framework = espidf, arduino
lib_deps = ${env.lib_deps}
lib_ignore =
    OpenThread
    BLE
    BluetoothSerial
    SimpleBLE
    WiFiProv
    Insights
    RainMaker
    Zigbee
    ESP_SR
    ESP_I2S
build_unflags =
    -std=c++17
    -std=gnu++2b
    -mdisable-hardware-atomics
    -DCORE_DEBUG_LEVEL=5            ; remove env.* verbose level for Matter builds
build_flags =
    ${env.build_flags}
    -std=gnu++17
    ; ── Matter feature enable ──────────────────────────────────────────────
    -D MATTER_ENABLED
    ; Voll Pool-Steuerung + voll Bridge (Config.h-Defaults). Bisect/Commissioning: POOLMASTER_ENABLE_ALL_POOL_TASKS=0, MATTER_MINIMAL_DEVICE=1, dann ggf. Matter-Factory-Reset
    -D CHIP_HAVE_CONFIG_H
    ; ── Suppress verbose Arduino HAL/I2C logs which starve the CHIPoBLE
    ;    event loop and cause the Apple Home commissioning handshake to time
    ;    out after ~15 s.  INFO level is plenty for diagnosing Matter issues.
    -D CORE_DEBUG_LEVEL=3
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
    ; CHIP task priority is configured via sdkconfig.h (CONFIG_CHIP_TASK_PRIORITY).
    ; Defining it on the command line conflicts with the IDF's own definition.
    ; ── Stack sizes: T14 needs extra space for CHIP lock calls ────────────
    -D STACK_T14=4096
    -D PT14=5000
    ; Arduino-Loop-Task & ESP-Main-Task etwas größer (wie SolarControl matter_dev).
    ; PoolMaster's loop() ruft WebUI / Nextion / OTA-Pfade auf, die mit den
    ; Standard-4 KB knapp werden können sobald Matter-Stack-Locks gehalten werden.
    -D ARDUINO_LOOP_STACK_SIZE=8192
    -D CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192
    ; Phase 1 Matter commissioning: quieter logs / less Serial work in NimBLE GAP path
    -D MATTER_LOG_EXTRA_CHIP_TAGS=0
    -D MATTER_BLE_GAP_DIAG_LISTENER=0
    ; Wi‑Fi PS MAX while fabrics==0 can delay UDP/IP during CASE after AddNOC → 60s fail‑safe expiry
    -D MATTER_WIFI_PS_MAX_WHILE_UNCOMMISSIONED=0
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
upload_protocol = esptool
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; extra_scripts inherited from [env]

[env:matter_ota]
framework = espidf, arduino
lib_deps = ${env.lib_deps}
lib_ignore =
    OpenThread
    BLE
    BluetoothSerial
    SimpleBLE
    WiFiProv
    Insights
    RainMaker
    Zigbee
    ESP_SR
    ESP_I2S
build_unflags =
    -std=c++17
    -std=gnu++2b
    -mdisable-hardware-atomics
    -DCORE_DEBUG_LEVEL=5
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -D MATTER_ENABLED
    ; match matter_serial — full pool tasks and full bridge
    -D CHIP_HAVE_CONFIG_H
    -D CORE_DEBUG_LEVEL=3
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
    -D STACK_T14=4096
    -D PT14=5000
    -D ARDUINO_LOOP_STACK_SIZE=8192
    -D CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192
    ; Phase 1 Matter commissioning: quieter logs / less Serial work in NimBLE GAP path
    -D MATTER_LOG_EXTRA_CHIP_TAGS=0
    -D MATTER_BLE_GAP_DIAG_LISTENER=0
    -D MATTER_WIFI_PS_MAX_WHILE_UNCOMMISSIONED=0
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
upload_protocol = espota
upload_port = 192.168.178.156
upload_flags =
    --port=8063
    --auth=12EFG!!4k
; extra_scripts inherited from [env]